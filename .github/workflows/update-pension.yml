name: Update Pension Data

on:
  schedule:
    - cron: '0 13 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/update_pension.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pension_history.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update pension data [skip ci]"
            git push
          fi