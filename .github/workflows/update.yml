name: Update Lotto Data

on:
  schedule:
    - cron: '0 13 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run collector
        run: python scripts/update_lotto.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto_history.csv docs/data/lotto_history.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update lotto data [skip ci]"
            git push
          fi
